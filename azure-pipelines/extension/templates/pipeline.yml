#
# Shared implementation for the stable.yml and pre-release.yml entry points.
# Declare Pylance-Eng using the repository resource alias "templates".

parameters:
  - name: buildSteps
    type: stepList
  - name: publishExtension
    type: boolean
  - name: teamName
    type: string
  - name: isPreRelease
    type: boolean
  - name: validationNotifyUsers
    type: string
  - name: ghCreateTag
    type: boolean
  - name: ghCreateRelease
    type: boolean
  - name: ghReleaseAddChangeLog
    type: boolean
  - name: customNPMRegistry
    type: string
  - name: sourceRepositoriesToExclude
    type: object
  - name: sourceAnalysisPool
    type: string
  - name: pullLocalization
    type: boolean
  - name: nodeVersion
    type: string
  - name: workingDirectory
    type: string
  - name: buildPlatforms
    type: object
  - name: standardizedVersioning
    type: boolean
  - name: vscePackageArgs
    type: string

resources:
  repositories:
    - repository: MicroBuildTemplate
      type: git
      name: 1ESPipelineTemplates/MicroBuildTemplate
      ref: refs/tags/release

extends:
  template: azure-pipelines/MicroBuild.1ES.Official.yml@MicroBuildTemplate
  parameters:
    sdl:
      sourceAnalysisPool: ${{ parameters.sourceAnalysisPool }}
      ${{ if or(parameters.pullLocalization, ne(length(parameters.sourceRepositoriesToExclude), 0)) }}:
        sourceRepositoriesToScan:
          ${{ if parameters.pullLocalization }}:
            include:
              - repository: localizationTools
          exclude:
            - ${{ if parameters.pullLocalization }}:
                - repository: translations
            - ${{ each repository in parameters.sourceRepositoriesToExclude }}:
                - ${{ repository }}
      codeSignValidation:
        enabled: true
      sbom:
        enabled: false
    pool:
      name: AzurePipelines-EO
      os: windows
    customBuildTags:
      - ES365AIMigrationTooling
    stages:
      - stage: Build
        displayName: Build & Package Extension
        jobs:
          - template: /azure-pipelines/extension/templates/jobs/package.yml@templates
            parameters:
              buildSteps: ${{ parameters.buildSteps }}
              customNPMRegistry: ${{ parameters.customNPMRegistry }}
              nodeVersion: ${{ parameters.nodeVersion }}
              workingDirectory: ${{ parameters.workingDirectory }}
              buildPlatforms: ${{ parameters.buildPlatforms }}
              isPreRelease: ${{ parameters.isPreRelease }}
              standardizedVersioning: ${{ parameters.standardizedVersioning }}
              vscePackageArgs: ${{ parameters.vscePackageArgs }}
              pullLocalization: ${{ parameters.pullLocalization }}
      - ${{ if eq(parameters.isPreRelease, false) }}:
          - stage: WaitForValidation
            displayName: Wait for Validation
            dependsOn: Build
            condition: and(succeeded(), ${{ eq(parameters.publishExtension, true) }})
            jobs:
              - job: wait_for_validation
                displayName: Wait for manual validation
                pool: server
                steps:
                  - task: ManualValidation@0
                    timeoutInMinutes: 1440
                    inputs:
                      notifyUsers: ${{ parameters.validationNotifyUsers }}
                      instructions: 'please test the latest draft release then publish it.'
                      onTimeout: reject
      - stage: Publish
        displayName: Publish Extension
        ${{ if eq(parameters.isPreRelease, true) }}:
          dependsOn: Build
        ${{ else }}:
          dependsOn: WaitForValidation
        condition: and(succeeded(), ${{ eq(parameters.publishExtension, true) }})
        jobs:
          - template: /azure-pipelines/extension/templates/jobs/publish-extension.yml@templates
            parameters:
              buildPlatforms: ${{ parameters.buildPlatforms }}
              customNPMRegistry: ${{ parameters.customNPMRegistry }}
              nodeVersion: ${{ parameters.nodeVersion }}
              publishExtension: ${{ parameters.publishExtension }}
              preRelease: ${{ parameters.isPreRelease }}
              teamName: ${{ parameters.teamName }}
              ghCreateTag: ${{ parameters.ghCreateTag }}
              ghCreateRelease: ${{ parameters.ghCreateRelease }}
              ghReleaseAddChangeLog: ${{ parameters.ghReleaseAddChangeLog }}
