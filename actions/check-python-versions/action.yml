name: Check CI Python versions
description: Check workflow matrices for the newest published Python release-candidate series.

inputs:
  files:
    description: YAML list of entries with a checkout-relative path and a Python matrix key.
    required: true
  create-issue:
    description: Create an issue when coverage is missing; false enables check-only mode.
    default: 'true'
  token:
    description: GitHub token with issues write permission; required in issue mode.
    required: false
  issue-labels:
    description: Comma-separated existing labels to apply to new issues.
    default: ''

outputs:
  latest-version:
    description: Newest published Python release-candidate series, as major.minor.
    value: ${{ steps.check.outputs.latest-version }}
  missing-matrices:
    description: JSON array of file/job/key entries missing the selected series.
    value: ${{ steps.check.outputs.missing-matrices }}
  issue-url:
    description: Newly created issue URL; empty in check-only mode or when covered.
    value: ${{ steps.check.outputs.issue-url }}

runs:
  using: composite
  steps:
    - name: Check runner
      shell: bash
      run: |
        if [[ "$RUNNER_OS" != "Linux" ]]; then
          echo "::error::This action requires an Ubuntu runner."
          exit 1
        fi
    - name: Set up tooling Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'
    - name: Install checker dependencies
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check -r "$ACTION_PATH/requirements.txt"
    - name: Check Python matrices
      id: check
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CHECK_FILES: ${{ inputs.files }}
        CHECK_CREATE_ISSUE: ${{ inputs.create-issue }}
        CHECK_TOKEN: ${{ inputs.token }}
        CHECK_ISSUE_LABELS: ${{ inputs.issue-labels }}
      run: python "$ACTION_PATH/scripts/check_python_versions.py"
