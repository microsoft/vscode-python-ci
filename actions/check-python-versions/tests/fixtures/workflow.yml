name: Python matrix fixture
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14', '3.15']
    steps:
      - run: echo "Static Python matrix fixture"
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - 3.10
          - '3.15.0rc1'
    steps:
      - run: echo "Multiline Python matrix fixture"
  floating:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.x']
    steps:
      - run: echo "Floating-only matrix fixture"
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
    steps:
      - run: echo "Non-Python matrix fixture"
