name: Get next or previous extension version
description: Calculate an odd/even-minor extension version without modifying its manifest.

inputs:
  package-json-path:
    description: Manifest path, absolute or relative to the caller's workspace.
    default: package.json
  type:
    description: pre-release selects an odd minor; release selects an even minor.
    required: true
  strategy:
    description: Version calculation strategy; currently odd-even-minor.
    required: true
  direction:
    description: next selects a strictly higher minor; previous selects a strictly lower minor.
    default: next
  pre-release-suffix:
    description: Optional prerelease identifiers without a leading -; ignored for release.
    default: ""

outputs:
  version:
    description: The calculated version.
    value: ${{ steps.calculate.outputs.version }}

runs:
  using: composite
  steps:
    - name: Read the current extension version
      id: current
      uses: $/actions/get-extension-version
      with:
        package-json-path: ${{ inputs.package-json-path }}
    - name: Calculate the extension version
      id: calculate
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CURRENT_VERSION: ${{ steps.current.outputs.version }}
        VERSION_TYPE: ${{ inputs.type }}
        VERSION_STRATEGY: ${{ inputs.strategy }}
        VERSION_DIRECTION: ${{ inputs.direction }}
        PRE_RELEASE_SUFFIX: ${{ inputs.pre-release-suffix }}
      run: |
        python "$ACTION_PATH/scripts/next_version.py"
