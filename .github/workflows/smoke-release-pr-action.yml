name: Validate release PR action

on:
  push:
    paths:
      - actions/release-pr/**
      - .github/workflows/smoke-release-pr-action.yml
  pull_request:
    paths:
      - actions/release-pr/**
      - .github/workflows/smoke-release-pr-action.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Run release PR tests
        run: python -m unittest discover -s actions/release-pr/tests -v

  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Smoke test read-only action on this repository's PR
        id: plan
        uses: ./actions/release-pr
        with:
          mode: plan
      - name: Confirm this engineering PR is not an extension release
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: test -z "$VERSION"
